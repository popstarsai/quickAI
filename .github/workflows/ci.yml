name: QuickAI tests and two-model smoke run

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Train two nano models on CPU
        run: >-
          python -m quickai.train --device cpu --minutes 3 --steps 25
          --batch-size 4 --block-size 32 --eval-batches 2 --out-dir runs
      - name: Upload checkpoints, samples and metrics
        uses: actions/upload-artifact@v4
        with:
          name: quickai-two-models-${{ github.run_number }}
          path: runs/
          retention-days: 7
